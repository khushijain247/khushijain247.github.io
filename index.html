<!DOCTYPE html>
<html>
<head>
  <title>Khushi Jain | Portfolio</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #0f0f0f;
      color: white;
      padding: 60px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 60px;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }

    .card {
      background: #1c1c1c;
      padding: 30px;
      border-radius: 15px;
      text-decoration: none;
      color: white;
      transition: 0.3s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      background: #252525;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    footer {
      margin-top: 80px;
      color: #777;
      font-size: 14px;
    }

  </style>
</head>

<body>

  <h1>Khushi Jain</h1>
  <p class="subtitle">Student • Builder • Creative Problem Solver</p>

  <div class="projects">

    <a href="habit-loop.html" class="card">
      <h3>Brew and Beyond</h3>
      <p>A modern coffee brand reinterpreting traditional Indian sustainable materials through a minimal design system.</p>
    </a>

    <a href="about.html" class="card">
      <h3>About Me</h3>
      <p>My journey, interests, and long-term vision.</p>
    </a>

  </div>

  <footer>
    © 2026 Khushi Jain
  </footer>

</body>
</html>
